name: Refresh repo stats

# Manual only — writes stars / last push / archived to data/agents_stats.csv
# and commits it. Run it from the Actions tab whenever you want fresh numbers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch stats
        run: python3 tools/agents.py csv --stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/agents_stats.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh repo stats"
            git push
          fi
